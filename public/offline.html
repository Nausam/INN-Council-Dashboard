<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Council HR</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #fff; color: #0a3639; font-family: Arial, Helvetica, sans-serif; }
      .card { width: min(100%, 430px); padding: 36px; border: 1px solid #d7e7e2; border-radius: 24px; background: #fff; box-shadow: 0 16px 40px rgba(10,54,57,.06); }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; padding: 8px; border: 1px solid #d7e7e2; border-radius: 16px; background: #fff; }
      .mark img { display: block; width: 100%; height: auto; }
      small { display: block; margin-top: 28px; color: #0a6968; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: 38px; font-weight: 800; letter-spacing: -.05em; line-height: 1.1; }
      p { color: #607b79; line-height: 1.6; }
      button { margin-top: 18px; padding: 13px 22px; border: 0; border-radius: 99px; background: #0a6968; color: #fff; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><img src="/council-logo.png" alt="Innamaadhoo Council" /></div>
      <small>Council HR</small>
      <h1>Connection paused.</h1>
      <p>Reconnect to view the latest employee records, attendance, leave, and pay information.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
